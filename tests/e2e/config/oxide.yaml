variables:
  KUBERNETES_VERSION: "v1.36.6"
  CONTROL_PLANE_MACHINE_COUNT: "1"
  WORKER_MACHINE_COUNT: "0"
  OXIDE_PROJECT: "cluster-api-provider-oxide"
  OXIDE_VPC: "default"
  OXIDE_SUBNET: "default"
  OXIDE_IMAGE_ID: "a6d8efd7-ad86-4ef8-8589-43648f1b9675"
  CNI: "./data/cni/calico.yaml"
  CCM: "./data/ccm/oxide-ccm.yaml"
  CCM_SECRET: "./data/ccm/oxide-ccm-secret.yaml"

providers:
- name: cluster-api
  type: CoreProvider
  versions:
  - name: v1.14.3
    value: https://github.com/kubernetes-sigs/cluster-api/releases/download/v1.14.3/core-components.yaml
    type: url
    contract: v1beta2
    files:
    - sourcePath: "../data/shared/capi/metadata.yaml"

- name: kubeadm
  type: BootstrapProvider
  versions:
  - name: v1.14.3
    value: https://github.com/kubernetes-sigs/cluster-api/releases/download/v1.14.3/bootstrap-components.yaml
    type: url
    contract: v1beta2
    files:
    - sourcePath: "../data/shared/capi/metadata.yaml"

- name: kubeadm
  type: ControlPlaneProvider
  versions:
  - name: v1.14.3
    value: https://github.com/kubernetes-sigs/cluster-api/releases/download/v1.14.3/control-plane-components.yaml
    type: url
    contract: v1beta2
    files:
    - sourcePath: "../data/shared/capi/metadata.yaml"

- name: oxide
  type: InfrastructureProvider
  versions:
  # v0.0.0 is a placeholder that will never be released, so the static
  # metadata.yaml fixture below (covering only the 0.0 series) never needs
  # updating as real releases are cut.
  - name: v0.0.0
    value: ../data/capox/capox.yaml
    type: url
    contract: v1beta2
    files:
    - sourcePath: "../data/infrastructure-oxide/metadata.yaml"
    - sourcePath: "../data/infrastructure-oxide/cluster-template.yaml"

intervals:
  default/wait-controllers:    ["4m", "10s"]
  default/wait-cluster:        ["5m", "10s"]
  default/wait-control-plane:  ["10m", "10s"]
  default/wait-worker-nodes:   ["5m", "10s"]
  default/wait-delete-cluster: ["3m", "10s"]
